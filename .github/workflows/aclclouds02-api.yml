name: ACLClouds02-API自動續期

# 第二個 ACLClouds 帳號（jeffer1 / 伺服器「Mon bot」）續期。
# 走 Client API Key（ptlc_）路線：零 Cookie、零 Captcha、零瀏覽器、零代理，
# 所以唔受 Laravel session 過期同 Turnstile 影響，唔需要 2 小時密跑。
on:
  schedule:
    # 續期窗口 = 到期前 2 日（面板免費計劃規則），窗口闿 2 日。
    #
    # 2026-10-05 降頻 6h → 12h：實測（run #12-#17）確認 API Key 路線
    # 對免費機續期行唔通 —— captcha 卡片答得啱、token 攞到，但 renew 端點
    # 唔認 API-key 身份（4 個 payload 變體 × 3 輪 = 12 次全被 403，
    # 最後觸發 429）。繼續每 6h 撞只會加深 rate limit、零收益。
    # 呢個 cron 而家實際角色＝低頻到期巡檢 + 提醒，唔再係自動續期主力。
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aclclouds02-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 檢出代碼
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安裝依賴
        # ddddocr = 續期端點自家 anti-bot 驗證（403 captcha_required）嘅卡片 OCR
        run: pip install requests ddddocr

      - name: 執行續期（API Key 模式）
        env:
          ACL_API_KEYS: ${{ secrets.ACL_API_KEYS }}
          ACL_SERVER_ALIASES: ${{ secrets.ACL_SERVER_ALIASES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python acl_api_renew.py
