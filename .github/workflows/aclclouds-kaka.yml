name: AclClouds-卡卡自动续期

on:
  schedule:
    # 每 6 小时检查一次（GitHub Actions 可能延迟，但比每日一次更抗漏跑）
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# 防止上一次续期未完成时并发触发，避免重复 Renew。
concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖 (xvfb 供浏览器 GUI 操作 + 中文字体)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          pip install -r requirements.txt
          # Playwright：保留作浏览器自动化备用；当前主流程仍用 SeleniumBase。
          pip install playwright
          python -m playwright install chromium
          seleniumbase install chromedriver || true

      - name: 执行续期
        env:
          ACL_COOKIES: ${{ secrets.ACL_COOKIES }}
          ACL_ACCOUNTS: ${{ secrets.ACL_ACCOUNTS }}
          ACL_EMAIL: ${{ secrets.ACL_EMAIL }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          IS_PROXY: "false"
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # xvfb-run 提供虚拟显示器, uc_gui_click_captcha 的 GUI 点击才能工作
        run: xvfb-run --auto-servernum python renew_fixed.py
