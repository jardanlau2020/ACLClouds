name: AclClouds-卡卡自动续期

on:
  schedule:
    # 每 6 小时检查一次（GitHub Actions 可能延迟，但比每日一次更抗漏跑）
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# 防止上一次续期未完成时并发触发，避免重复 Renew。
concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖 (xvfb 供浏览器 GUI 操作 + 中文字体)
        run: |
          # dl.google.com Chrome 源偶發 Hash Sum mismatch 會令 apt-get update 非零退出；
          # xvfb/字体黎自 Ubuntu 源，Google 源壞唔影響，行 tolerate 得嘅 update
          sudo apt-get update || sudo apt-get update || echo "⚠️ apt update 有部分源失敗，忽略（用舊索引繼續）"
          sudo apt-get install -y xvfb fonts-noto-cjk
          pip install -r requirements.txt
          seleniumbase install chromedriver || true

      - name: 設置住宅代理 (sing-box via NODE_LINK)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: bash ./setup_proxy.sh

      - name: 执行续期
        env:
          ACL_COOKIES: ${{ secrets.ACL_COOKIES }}
          ACL_ACCOUNTS: ${{ secrets.ACL_ACCOUNTS }}
          ACL_EMAIL: ${{ secrets.ACL_EMAIL }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # xvfb-run 提供虚拟显示器, uc_gui_click_captcha 的 GUI 点击才能工作
        run: |
          # IS_PROXY/PROXY_SERVER 由 setup_proxy.sh 經 GITHUB_ENV 注入 (未配橋則直連)
          if [ "$IS_PROXY" = "true" ]; then
            echo "🔗 本次跑批走住宅代理: $PROXY_SERVER"
            IP=$(curl -s --max-time 8 -x socks5://127.0.0.1:1080 https://api.ipify.org 2>/dev/null || true)
            echo "🌍 代理出口 IP: ${IP:-取不到}"
          else
            echo "🌐 無代理, 直連 (數據中心 IP, Turnstile 可能會擋)"
          fi
          xvfb-run --auto-servernum python renew_fixed.py

      - name: 📸 上传调试截图 (如有)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acl-debug-screenshots
          path: |
            acl_browser_*.png
            acl_login_failed.png
          if-no-files-found: ignore
          retention-days: 5
