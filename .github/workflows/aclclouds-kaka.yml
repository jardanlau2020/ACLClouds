name: AclClouds-卡卡自动续期

on:
  schedule:
    # 每 6 小时检查一次（GitHub Actions 可能延迟，但比每日一次更抗漏跑）
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# 防止上一次续期未完成时并发触发，避免重复 Renew。
concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖 (xvfb 供浏览器 GUI 操作 + 中文字体)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          pip install -r requirements.txt
          seleniumbase install chromedriver || true

      - name: 啟動本地 TUIC 代理橋 (sing-box)
        if: ${{ secrets.TUIC_PROXY != '' }}
        env:
          TUIC_PROXY: ${{ secrets.TUIC_PROXY }}
        run: |
          set -e
          cd /tmp
          curl -sL -o sb.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz
          tar xzf sb.tar.gz
          SB="sing-box-1.14.0-linux-amd64/sing-box"
          chmod +x "$SB"
          TUIC_PROXY="$TUIC_PROXY" python3 "$GITHUB_WORKSPACE/tuic_bridge.py" > /tmp/tuic.json
          # 只印非敏感参数 (uuid 不入 log)
          python3 -c "
          import json
          c=json.load(open('/tmp/tuic.json'))
          o=c['outbounds'][0]
          print('🔌 TUIC 橋:', o['server'], ':', o['server_port'], 'sni=', o['tls']['server_name'], 'alpn=', o['tls'].get('alpn'))
          "
          "$SB" run -c /tmp/tuic.json > /tmp/tuic.log 2>&1 &
          echo $! > /tmp/tuic.pid
          ok=""
          for i in $(seq 1 30); do
            IP=$(curl -s --max-time 6 -x http://127.0.0.1:10800 https://api.ipify.org 2>/dev/null || true)
            if [ -n "$IP" ]; then ok=1; echo "✅ TUIC 橋已就緒, 代理出口 IP: $IP"; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "❌ TUIC 橋 30s 未通, sing-box 日志:"
            tail -20 /tmp/tuic.log
            exit 1
          fi

      - name: 执行续期
        env:
          ACL_COOKIES: ${{ secrets.ACL_COOKIES }}
          ACL_ACCOUNTS: ${{ secrets.ACL_ACCOUNTS }}
          ACL_EMAIL: ${{ secrets.ACL_EMAIL }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          IS_PROXY: ${{ (secrets.TUIC_PROXY != '' && 'true') || secrets.IS_PROXY }}
          PROXY_SERVER: ${{ (secrets.TUIC_PROXY != '' && 'http://127.0.0.1:10800') || secrets.PROXY_SERVER }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # xvfb-run 提供虚拟显示器, uc_gui_click_captcha 的 GUI 点击才能工作
        run: xvfb-run --auto-servernum python renew_fixed.py

      - name: 📸 上传调试截图 (如有)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acl-debug-screenshots
          path: |
            acl_browser_*.png
            acl_login_failed.png
          if-no-files-found: ignore
          retention-days: 5
